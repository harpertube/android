name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: marler8997/setup-anyzig@master
      - name: Get the signing key
        shell: bash
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ]; then
            echo "error: the RELEASE_KEYSTORE secret isn't set; see README.md" >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE" | base64 --decode > release.keystore
      - run: zig build install-signed --summary all
